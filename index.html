<style>
  body {
    font-family: var(--cnvs-sys-font-family-default);
  }

  /* Sidebar selected item only — do not change colorSecondary in theme.js (breaks docs links) */
  div.sidebar-item[data-nodetype][data-selected='true'],
  div.sidebar-item[data-nodetype][data-selected='true']:hover,
  div.sidebar-item[data-nodetype][data-selected='true']:focus,
  div.sidebar-item[data-nodetype][data-selected='true']:focus-visible {
    background: rgba(0, 127, 255, 0.1098) !important;
    color: rgba(0, 87, 174, 1) !important;
  }

  div.sidebar-item[data-nodetype][data-selected='true'] svg {
    color: inherit !important;
  }
</style>
 

    <style>
      #storybook-root[hidden] {
        display: none !important;
      }
    </style>

    
  </head>
  <body>
    <div id="root"></div>

    
    <script>
      
        
          window['FEATURES'] = {
  "argTypeTargetsV7": true,
  "legacyDecoratorFileOrder": false,
  "disallowImplicitActionsInRenderV8": true
};
        
      
        
          window['REFS'] = {};
        
      
        
          window['LOGLEVEL'] = "info";
        
      
        
          window['DOCS_OPTIONS'] = {
  "defaultName": "Docs",
  "autodocs": "tag"
};
        
      
        
          window['CONFIG_TYPE'] = "PRODUCTION";
        
      
        
      
        
      
        
          window['TAGS_OPTIONS'] = {
  "dev-only": {
    "excludeFromDocsStories": true
  },
  "docs-only": {
    "excludeFromSidebar": true
  },
  "test-only": {
    "excludeFromSidebar": true,
    "excludeFromDocsStories": true
  }
};
        
      
        
          window['STORYBOOK_RENDERER'] = "react";
        
      
        
          window['STORYBOOK_BUILDER'] = "@storybook/builder-vite";
        
      
        
          window['STORYBOOK_FRAMEWORK'] = "@storybook/react-vite";
        
      
    </script>
